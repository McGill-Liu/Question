<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大学英语4样卷1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>大学英语4样卷1</h1>
        <div class="question-section">
            <div id="question-container"></div>
            <div class="navigation">
                <button id="prev-btn">上一题</button>
                <button id="next-btn">下一题</button>
                <button id="submit-btn">交卷</button>
                <button id="answer-btn">查看/隐藏答案</button>
            </div>
            <div class="progress">
                <span id="current-question">1</span> / <span id="total-questions">1</span>
            </div>
        </div>
        <div class="question-list">
            <h3>题目列表:</h3>
            <div id="question-numbers"></div>
        </div>
    </div>
    
    <script src="questions.js"></script>
    <script src="english4-sample1_questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
